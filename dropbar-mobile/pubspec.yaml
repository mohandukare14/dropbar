name: dropbar_mobile
description: "Cross-platform mobile companion for DropBar - Drag & drop files between Arch Linux and Mobile"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  file_picker: ^8.1.2
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
