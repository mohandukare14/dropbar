# DropBar Hyprland Configuration
# Window rules for DropBar floating shelf
windowrulev2 = float, class:^(dropbar-desktop)$
windowrulev2 = pin, class:^(dropbar-desktop)$
windowrulev2 = noborder, class:^(dropbar-desktop)$
windowrulev2 = nodim, class:^(dropbar-desktop)$
windowrulev2 = size 460 300, class:^(dropbar-desktop)$
windowrulev2 = move 50% 88%, class:^(dropbar-desktop)$
windowrulev2 = animation slide bottom, class:^(dropbar-desktop)$

# Keybind: Super + T to toggle / launch DropBar
bind = $mainMod, T, exec, /home/mohan/Projects/dropbar/target/debug/dropbar-desktop
