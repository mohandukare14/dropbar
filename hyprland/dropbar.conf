# DropBar Hyprland Configuration
# Window rules for DropBar floating shelf
windowrulev2 = float, class:^(io.dropbar.desktop)$
windowrulev2 = pin, class:^(io.dropbar.desktop)$
windowrulev2 = noborder, class:^(io.dropbar.desktop)$
