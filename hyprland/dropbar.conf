# DropBar Hyprland Configuration
# Window rules for DropBar floating shelf docked to screen edge
windowrulev2 = float, class:^(io.dropbar.desktop)$
windowrulev2 = pin, class:^(io.dropbar.desktop)$
windowrulev2 = noborder, class:^(io.dropbar.desktop)$
windowrulev2 = nodim, class:^(io.dropbar.desktop)$
windowrulev2 = move 100%-396 18%, class:^(io.dropbar.desktop)$
windowrulev2 = animation slide right, class:^(io.dropbar.desktop)$

# Also support alternate class names
windowrulev2 = float, class:^(dropbar-desktop)$
windowrulev2 = pin, class:^(dropbar-desktop)$

# Keybind: Super + T to toggle / launch DropBar
bind = $mainMod, T, exec, /home/mohan/Projects/dropbar/target/debug/dropbar-desktop
