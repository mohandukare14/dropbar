name: Build DropBar Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Generate Android project files
        run: |
          cd dropbar-mobile
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create . --org io.dropbar --project-name dropbar_mobile --platforms=android
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          # Set compileSdk and targetSdk to 35 for modern Android compatibility
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/g' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' android/app/build.gradle
          flutter pub get

      - name: Build Release APK
        run: |
          cd dropbar-mobile
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropBar-Release-APK
          path: dropbar-mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.1.0-mobile
          name: "DropBar Mobile v0.1.0"
          body: "Direct download DropBar Android APK for P4 and other mobile devices."
          files: dropbar-mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
