[package]
name = "dropbar-desktop"
version = "0.1.0"
edition = "2021"
description = "Floating drag and drop shelf and cross-device sync bar for Arch Linux Hyprland"

[dependencies]
dropbar-core = { path = "../dropbar-core" }
gtk4 = { version = "0.9" }
glib = "0.20"
gio = "0.20"
notify-rust = "4.19"
tokio = { version = "1.40", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
open = "5.3"
tracing = "0.1"
tracing-subscriber = "0.3"

