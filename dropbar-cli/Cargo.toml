[package]
name = "dropbar-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for DropBar peer discovery and file transfer"

[dependencies]
dropbar-core = { path = "../dropbar-core" }
tokio = { version = "1.40", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
colored = "2.1"

